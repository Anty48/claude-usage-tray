<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Claude Usage Tray — unofficial usage monitor for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#faf6ee"/>
      <stop offset="1" stop-color="#f1e8d8"/>
    </linearGradient>
    <linearGradient id="gauge" x1="470" y1="360" x2="740" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f9b6b"/>
      <stop offset="0.5" stop-color="#e0a44e"/>
      <stop offset="1" stop-color="#df6e3c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- logo mark -->
  <g transform="translate(96,150)">
    <rect x="0" y="0" width="132" height="132" rx="34" fill="#f1ece1" stroke="#e7dccb" stroke-width="2"/>
    <path d="M32 108 A46 46 0 1 1 100 108" fill="none" stroke="url(#gauge)" stroke-width="14" stroke-linecap="round"/>
    <path d="M52 52 L70 66 L52 80" fill="none" stroke="#2a2622" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M76 80 L94 80" fill="none" stroke="#2a2622" stroke-width="7.5" stroke-linecap="round"/>
  </g>
  <!-- pill -->
  <g transform="translate(264,178)">
    <rect x="0" y="0" width="470" height="40" rx="20" fill="#efe4d2"/>
    <text x="24" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="#8a5a3c">UNOFFICIAL · LIGHTWEIGHT · PRIVACY-FOCUSED</text>
  </g>
  <text x="264" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#2a2622">Know your Claude</text>
  <text x="264" y="382" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#2a2622">Code usage.</text>
  <text x="266" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6656">A lightweight, unofficial usage monitor — right from your</text>
  <text x="266" y="492" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6656">system tray or menu bar.</text>
  <text x="96" y="576" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a2622">Claude Usage Tray</text>
  <text x="96" y="606" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9a9082">Independent project · not affiliated with Anthropic · Windows &amp; macOS</text>
  <text x="1104" y="600" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#b0a798">github.com/Anty48/claude-usage-tray</text>
</svg>
