name: Release

# Push a tag like `v1.0.0` to build installers for every platform and publish a GitHub Release.
#   git tag v1.0.0
#   git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows (x64) installer
            os: windows-latest
            target: ""
            bundles: nsis
          - label: macOS (Apple Silicon) dmg
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          # Intel (x64) is cross-compiled on the Apple-silicon runner: the dedicated
          # macos-13 Intel runners are being retired and were queuing for hours, while
          # macos-14 builds the x86_64 target reliably in minutes (dmg packaging only).
          - label: macOS (Intel) dmg
            os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tauri CLI (prebuilt)
        run: npm i -g @tauri-apps/cli@^2

      - name: Run tests
        run: cargo test -p claude-usage-core

      # macOS signing strategy:
      #   * If real Developer-ID secrets exist  -> sign + notarize (best: no prompt at all).
      #   * Otherwise                            -> AD-HOC sign (APPLE_SIGNING_IDENTITY="-").
      #
      # The ad-hoc branch is essential, not cosmetic: Apple Silicon (arm64) refuses to run any
      # binary that has NO signature at all, and a download's quarantine flag then makes macOS
      # report the app as "damaged and can't be opened". Ad-hoc signing gives the bundle a valid
      # (self) signature so the app runs after Gatekeeper is cleared, turning the hard "damaged"
      # block into the normal "unidentified developer" prompt (right-click Open / xattr).
      #
      # `codesign -s -` (ad-hoc) needs no certificate or keychain, so we must NOT set the
      # APPLE_CERTIFICATE/APPLE_ID vars here — passing empty ones makes Tauri try to import an
      # empty certificate and fail.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            {
              echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
              echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
              echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
            echo "Apple Developer-ID secrets found — building signed & notarized."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No Developer-ID secrets — AD-HOC signing (runnable on arm64; Gatekeeper prompt on first launch)."
          fi

      # Same guard for optional Windows Authenticode / updater signing.
      - name: Configure Windows signing (optional)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          fi

      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            tauri build --bundles ${{ matrix.bundles }}
          fi

      # Fail fast if the .app ended up unsigned: an unsigned arm64 bundle would ship broken
      # ("damaged" on the user's Mac). `codesign --verify` succeeds for both ad-hoc and Developer-ID.
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(ls -d target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          echo "Verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Signature|Authority|flags|Identifier' || true

      - name: Collect & rename artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Key on the Rust target so both macOS dmgs can build on the same runner image.
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              src=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
              cp "$src" "dist/ClaudeUsageTray-macOS-arm64.dmg" ;;
            x86_64-apple-darwin)
              src=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
              cp "$src" "dist/ClaudeUsageTray-macOS-x64.dmg" ;;
            "")
              src=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
              cp "$src" "dist/ClaudeUsageTray-Setup.exe" ;;
          esac
          ls -la dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
